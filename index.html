<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://api.fontshare.com/v2/css?f[]=comico@400&display=swap" rel="stylesheet">
  <title>Explorando la Anatomía Humana</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Comico', sans-serif;
      background: url('https://i.ibb.co/wyHhVLp/cielo.jpg') no-repeat center center/cover;
      height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      width: 100%;
      padding: 10px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    header img {
      width: 70px;
      height: auto;
    }

    header h1 {
      color: #fff;
      font-size: 2.3rem;
      text-shadow: 3px 3px 5px #000;
    }

    .hero {
      flex: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 40px;
      min-height: 80vh;
    }

    .hero img {
      width: 200px;
      height: auto;
      transition: transform 0.3s;
    }

    .hero img:hover {
      transform: scale(1.05);
    }

    .botones {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      flex-wrap: nowrap;
      margin-bottom: 30px;
    }

    .botones a {
      background-color: #ffcc00;
      padding: 12px 20px;
      border-radius: 25px;
      text-decoration: none;
      color: #000;
      font-weight: bold;
      box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.4);
      transition: background 0.3s, transform 0.3s;
    }

    .botones a:hover {
      background-color: #ff9900;
      transform: scale(1.05);
    }

    /* 🔧 Responsivo */
    @media (max-width: 991px) {
      body {
        height: auto;
      }

      header {
        flex-direction: column;
      }

      .hero {
        flex-direction: column;
        justify-content: center;
        text-align: center;
        padding: 20px;
      }

      .hero img {
        width: 160px;
      }

      .botones {
        flex-wrap: wrap;
      }

      .botones a {
        flex: 1 1 40%;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Ciencia de Colores</h1>
    <img src="https://i.ibb.co/8gPjQKX/logo.png" alt="Logo">
  </header>

  <section class="hero">
    <img src="https://i.ibb.co/m9KXqdy/lado1.png" alt="Imagen izquierda">
    <div class="botones">
      <a href="#">Concepto</a>
      <a href="#">Sistemas</a>
      <a href="#">Juegos</a>
      <a href="#">Canciones</a>
      <a href="#">Iniciar sesión</a>
    </div>
    <img src="https://i.ibb.co/Prp4MWQ/lado2.png" alt="Imagen derecha">
  </section>
</body>
</html>
